[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taichi-matrix"
version = "0.1.0"
description = "TaiChi Matrix: Eastern Mathematics-driven AI Infrastructure Toolkit (CCF OSS 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-SA-4.0"}
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
all = [
    "taichi-matrix[torch]",
]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["taichi_matrix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
